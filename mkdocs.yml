site_name: Canon R7 EXR Converter
site_description: Converts Canon EOS R7 Canon Log 3 clips into ACEScg EXR sequences for Nuke.
site_url: https://vmarci2.github.io/r7convert/
repo_url: https://github.com/VMarci2/r7convert
repo_name: VMarci2/r7convert
edit_uri: ""
copyright: FVFX

docs_dir: docs
exclude_docs: |
  Teams banner*

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

nav:
  - Getting started:
      - Overview: index.md
      - Installing and updating: install.md
  - Using the converter:
      - Converting clips: converting.md
      - Opening in Nuke: nuke.md
      - Advanced settings: advanced.md
      - Dailies: dailies.md
  - Pipeline:
      - Headless mode: headless.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Technical reference: reference.md
      - Release notes: https://github.com/VMarci2/r7convert/releases
